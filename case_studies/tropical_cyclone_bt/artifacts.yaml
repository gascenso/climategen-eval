generated_sample_banks:
  - id: baseline_ztsnr_test
    role: track1_held_out_generation
    local_path: data/tropical_cyclone_bt/generated/baseline_ztsnr/test/test_baseline_n1000
    current_state: local_copy_or_hardlink
    archive_url: PENDING
    archive_sha256: PENDING
    sha256_manifest: data/tropical_cyclone_bt/generated/manifests/baseline_ztsnr_test.json
  - id: baseline_ztsnr_train_development
    role: >-
      track2 development only; prohibited for final holdout inference because the
      generator saw the complete diffusion training split
    local_path: data/tropical_cyclone_bt/generated/baseline_ztsnr/train/aug_guidance_train
    current_state: local_copy_or_hardlink_not_leakage_free
    archive_url: PENDING
    archive_sha256: PENDING
    sha256_manifest: >-
      data/tropical_cyclone_bt/generated/manifests/baseline_ztsnr_train_development.json

label_contract:
  wind_variable: USA_WIND
  averaging_period: 1-minute
  mixed_WMO_WIND_labels_prohibited: true
  real_manifest_schema: gauge_climate.tc_bt_real_dataset.v2

small_fixture:
  path: tests/fixtures/tc_bt
  status: GENERATED_SYNTHETIC
  manifest: tests/fixtures/tc_bt/manifest.json
  license: BSD-3-Clause

release_rule: >-
  Archive the USA_WIND real splits and baseline_ztsnr banks with permission-cleared
  URLs; record per-file SHA-256 checksums; provide three leakage-free generated
  banks from the restricted Track-2 generator fits; verify from a clean checkout;
  then set release_ready only through the release audit.
