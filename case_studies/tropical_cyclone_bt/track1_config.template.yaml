schema: gauge_climate.cli_config.v1
adapter: tc_bt

data:
  train:
    tc_real_manifest: ../../data/tropical_cyclone_bt/real_train/manifest.json
    target: category
  real:
    tc_real_manifest: ../../data/tropical_cyclone_bt/real_test/manifest.json
    target: category
  generated:
    tc_sample_bank: >-
      ../../data/tropical_cyclone_bt/generated/baseline_ztsnr/test/test_baseline_n1000
    target: category
    required_run: baseline_ztsnr

adapter_options:
  field_shape: [256, 256]
  bt_min_k: 170.0
  bt_max_k: 325.0
  clip_to_analysis_range: true
  pixel_size_km: 8.0
  core_radius_km: 100.0
  organization_radius_km: 300.0
  max_profile_radius_km: 500.0
  cold_threshold_k: 220.0
  profile_bins: 32
  psd_bins: 24
  eye_radius_km: 50.0
  eyewall_inner_km: 50.0
  eyewall_outer_km: 150.0
  dav_center_region_size: 3

feature_metrics:
  enabled: true
  n_eof: 20
  max_fit_samples: 512
  fit_seed: 1789
  density_k: 5
  bandwidth_seed: 1789
  max_samples_per_draw: 256
  dependence_pairs: true
  memorization:
    enabled: true
    match_labels: true
    require_copyist_control: true
    n_regions: 8
    n_resamples: 1000
    min_real_blocks: 5

tc_admissibility: true
sensitivity_results: control_results/sensitivity_lanes.json

evaluation:
  n_eval: null
  n_resamples: 2000
  diagnostic_resamples: 200
  diagnostic_resamples_by_metric:
    radial_profile_mae: 1000
    radial_log_psd_mse: 1000
    feature_mmd2: 1000
    feature_density: 1000
    feature_coverage_deficit: 2000
    feature_diversity_departure: 1000
    preprocessing_boundary_saturation: 1000
  sensitivity_resamples: 200
  alpha: 0.05
  confidence: 0.95
  estimand: block_balanced
  seed: 1789
  min_blocks_per_half: 10
  warn_blocks_per_half: 30
  shift_power: 0.80
  shift_grid_size: 33
  reference_stability_threshold: 0.25
  transform_batch_size: 128
  simultaneous_family:
    - global:w1:min_core_bt
    - global:w1:cold_frac_220
    - global:w1:r_maxgrad
    - global:w1:axisym
    - global:w1:dav
    - global:w1:eye_contrast
    - global:w1:p01_bt
    - 0:w1:min_core_bt
    - 0:w1:cold_frac_220
    - 0:w1:r_maxgrad
    - 0:w1:axisym
    - 0:w1:dav
    - 0:w1:eye_contrast
    - 0:w1:p01_bt
    - 1:w1:min_core_bt
    - 1:w1:cold_frac_220
    - 1:w1:r_maxgrad
    - 1:w1:axisym
    - 1:w1:dav
    - 1:w1:eye_contrast
    - 1:w1:p01_bt
    - 2:w1:min_core_bt
    - 2:w1:cold_frac_220
    - 2:w1:r_maxgrad
    - 2:w1:axisym
    - 2:w1:dav
    - 2:w1:eye_contrast
    - 2:w1:p01_bt
    - 3:w1:min_core_bt
    - 3:w1:cold_frac_220
    - 3:w1:r_maxgrad
    - 3:w1:axisym
    - 3:w1:dav
    - 3:w1:eye_contrast
    - 3:w1:p01_bt
    - 4:w1:min_core_bt
    - 4:w1:cold_frac_220
    - 4:w1:r_maxgrad
    - 4:w1:axisym
    - 4:w1:dav
    - 4:w1:eye_contrast
    - 4:w1:p01_bt
    - 5:w1:min_core_bt
    - 5:w1:cold_frac_220
    - 5:w1:r_maxgrad
    - 5:w1:axisym
    - 5:w1:dav
    - 5:w1:eye_contrast
    - 5:w1:p01_bt
    - C4_plus:w1:min_core_bt
    - C4_plus:w1:cold_frac_220
    - C4_plus:w1:r_maxgrad
    - C4_plus:w1:axisym
    - C4_plus:w1:dav
    - C4_plus:w1:eye_contrast
    - C4_plus:w1:p01_bt
  include_partitions: true

conditional: true
conditional_groups:
  C4_plus: [4, 5]
outputs:
  json: ../../outputs/tropical_cyclone_bt/gauge_track1/evaluation.json
  html: ../../outputs/tropical_cyclone_bt/gauge_track1/evaluation.html
  profile: ../../outputs/tropical_cyclone_bt/gauge_track1/reference_profile.pdf
