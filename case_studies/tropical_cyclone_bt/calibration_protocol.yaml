schema: gauge_climate.tc_bt_statistical_calibration_protocol.v1
status: FROZEN
scientific_use: training_only_pre_final_calibration
seed: 1789

source:
  real_train_manifest: ../../data/tropical_cyclone_bt/real_train/manifest.json
  partition_summary: partition_summary.json
  track1_config: track1_config.template.yaml
  test_fields_permitted: false
  test_metadata_use: >-
    Published per-class storm counts only, used to choose conservative
    training-block calibration sizes; no test field or functional value is read.

pseudo_generator:
  source: reserved_training_blocks
  block_count: match_reference_pool
  disjoint_from_reference_pool: true
  sampling_estimand: block_balanced

reference:
  estimand: block_balanced
  n_resamples: 2000
  sensitivity_resamples: 200
  alpha: 0.05
  target_power: 0.80
  shift_grid_size: 33
  min_blocks_per_half: 10
  reference_stability_tolerance: 0.25
  transform_batch_size: 64

# Global and C4+ use conservative lower bounds on their test block counts: the
# global set contains every TS storm, and C4+ contains every C4 storm. Native
# strata use the already-published partition-table counts. Each count applies
# separately to the real-reference and disjoint pseudo-generator training pools;
# no test values enter calibration.
strata:
  global: {labels: null, calibration_blocks: 368, n_eval: 6000}
  "0": {labels: [0], calibration_blocks: 368, n_eval: 1000}
  "1": {labels: [1], calibration_blocks: 211, n_eval: 1000}
  "2": {labels: [2], calibration_blocks: 149, n_eval: 1000}
  "3": {labels: [3], calibration_blocks: 106, n_eval: 1000}
  "4": {labels: [4], calibration_blocks: 76, n_eval: 1000}
  "5": {labels: [5], calibration_blocks: 22, n_eval: 1000}
  C4_plus: {labels: [4, 5], calibration_blocks: 76, n_eval: 2000}

tolerances:
  min_core_bt: 1.0
  cold_frac_220: 1.0
  r_maxgrad: 15.625
  axisym: 1.0
  dav: 100.0
  eye_contrast: 1.0
  p01_bt: 1.0

simultaneous_family:
  functionals: [min_core_bt, cold_frac_220, r_maxgrad, axisym, dav, eye_contrast, p01_bt]
  strata: [global, "0", "1", "2", "3", "4", "5", C4_plus]
  expected_size: 56
  method: Bonferroni_order_statistic_reference_position

gates:
  require_reference_plan_invariants: true
  require_pseudo_generator_reference_blocks_disjoint: true
  require_finite_reference_boundaries: true
  require_reference_stability: true
  require_finite_shift_resolution: true
  require_dkw_equality_lower_bound_zero: true
  require_finite_simultaneous_boundaries: true
  require_no_simultaneous_detection_for_registered_pseudo_generator: true
  tolerance_adequacy_is_reported_not_required: true
