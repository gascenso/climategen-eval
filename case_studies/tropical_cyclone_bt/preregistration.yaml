schema: gauge_climate.tc_bt_preregistration.v1
status: FROZEN
final_test_run_permitted: true

scope:
  field: storm-centered infrared brightness temperature
  sample_shape: [256, 256]
  channels: 1
  field_units: K
  analysis_preprocessing:
    operation: clip
    range_k: [170.0, 325.0]
    fit_source: generator_training_config
    raw_archives_preserved: true
    rationale: >-
      The generator was trained on real fields clipped to the 0.05th and 99.95th
      percentile limits before normalization. GAUGE evaluates the same declared
      field representation while retaining raw archives for provenance.
  pixel_size_km: 8.0
  classes: [TS, C1, C2, C3, C4, C5]
  excluded_class_claims: [TD]

estimand:
  primary: block_balanced
  block: storm_id
  sampling_description: uniformly sample a storm, then uniformly sample an eligible frame
  secondary_frame_weighted: false
  n_eval: all_available_generated_samples_per_registered_stratum

partitions:
  storm_disjoint_required: true
  wind_source: USA_WIND
  wind_averaging_period: 1-minute
  mixed_wmo_wind_labels_prohibited: true
  train_manifest_sha256: f8717849b8ca295f85c4e7bbfd116d0a5d20e88f201d7a55e464240c568a267a
  validation_manifest_sha256: c64ad082f47d60956a31233f571e347a00cd3304fa90dc2db22289dba456a3ed
  test_manifest_sha256: edd7d0f6bf3ec37c5332b53ee57afd9f690f32a6d98def7d3af60cdcb53fd89e
  thin_stratum: C5
  predeclared_aggregate:
    id: C4_plus
    members: [C4, C5]
    scientific_rationale: >-
      C4 and C5 are both major hurricanes (Vmax at least 113 kt); aggregating them
      preserves an operationally meaningful threshold while stabilizing the thin
      C5 reference (85 frames from 22 test storms).
  temporal_shift_analysis: descriptive_secondary_only_no_endpoint_switching

models:
  candidates: [baseline_ztsnr]
  primary: baseline_ztsnr
  secondary: []
  checkpoint_selection_rule: weights_ema_best_val; selected without Track-1 test metrics

functionals:
  - {id: min_core_bt, units: K, support: [170.0, 325.0], tolerance: 1.0}
  - {id: cold_frac_220, units: percent, support: [0.0, 100.0], tolerance: 1.0}
  - {id: r_maxgrad, units: km, support: [0.0, 500.0], tolerance: 15.625}
  - {id: axisym, units: K, support: [0.0, 155.0], tolerance: 1.0}
  - {id: dav, units: degree_squared, support: [0.0, 8100.0], tolerance: 100.0}
  - {id: eye_contrast, units: K, support: [-155.0, 155.0], tolerance: 1.0}
  - {id: p01_bt, units: K, support: [170.0, 325.0], tolerance: 1.0}

curve_metrics:
  radial_profile:
    radius_km: 500.0
    bins: 32
    center: image_center
    mask: none_within_grid
    missing_values: reject
  radial_psd:
    detrending: subtract_per_image_spatial_mean
    window: separable_hann
    normalization: divide_by_window_energy
    coordinates: physical_cycles_per_km
    radial_bins: 24_discrete_support_aware_log_targets
    zero_mode: excluded
    missing_values: reject

feature_space:
  fit_split: training_only
  scalar_standardization: training_mean_sd
  eof_components: 20
  eof_fit_sample_count: 512
  mmd_bandwidth_rule: training_only_median_distance
  set_metric_samples_per_reference_draw: 256
  set_metric_sampling: deterministic_matched_without_replacement
  memorization_regions: 8
  memorization_query_strata: intensity_class_by_feature_region

reference_computation:
  primary_functional_and_simultaneous_family_resamples: 2000
  secondary_diagnostic_resamples: 200
  complete_partition_record: deterministic_seed_plus_sha256_and_three_draw_preview

sensitivity_lanes:
  status: FROZEN
  design:
    seed: 1789
    control_block_count: 80
    n_control: 1000
    sampling_estimand: block_balanced
    reference_resamples: 500
    reference_boundary_quantile: 0.95
    sweep_pass_rule: >-
      Spearman severity rank correlation at least 0.8; whether maximum severity
      exceeds the real-reference boundary is reported separately as resolution
    minimum_blocks_per_half: 10
    feature_fit_samples: 512
    copyist_resamples: 1000
    batch_size: 64
    phase_power_relative_tolerance: 0.00001
  controls:
    copyist: {expected: localized_copying_detected, severity: exact_training_replay}
    blur: {expected: psd_and_gradient_response, sigma_pixels: [0.0, 0.5, 1.0, 2.0]}
    phase_shuffle: {expected: structure_response_with_spectrum_control, severity: full}
    warm_shift: {expected: monotone_BT_functional_response, kelvin: [0.0, 0.5, 1.0, 2.0, 4.0]}
    center_jitter: {expected: radial_structure_response, pixels: [0, 1, 2, 4]}
  interpretation_rule: a metric failing its predeclared response is not interpreted

track2:
  holdouts:
    count: 3
    storm_ids: [2006259N19155, 2016273N13300, 2018269N11220]
    plan_sha256: eb4a3b04eb45b51945ad90f8b2522c47096a7af9f09202b001998c6e9ac9aab9
    selection_seed: 1789
    eligibility: >-
      at least 20 total frames, at least 10 C4+ frames, at least one C5 frame,
      and every exact Vmax value represented in the restricted training set
    whole_storm_removal: true
  generator_retrained_per_holdout: true
  full_training_generator_bank_role: development_only_prohibited_for_final_contrasts
  generated_conditioning:
    variable: Vmax
    units: kt
    source_distribution: restricted_training_only
  matching_strata:
    variable: Vmax
    policy: exact_value_kt
  downstream_seeds: [101, 102, 103, 104, 105]
  callback_determinism_audit: true
  transforms:
    candidate: tc_rot90_reflect_shift_v1
    rotations: right_angles
    translations_pixels: [-2, 2]
    boundary: reflect_padding
    status: FROZEN
  primary_endpoint:
    task: Vmax_regression
    metric: storm_balanced_MAE_kt
    delta_task: 2.5
  secondary_endpoint:
    task: intensity_category_classification
    metric: storm_balanced_accuracy
    delta_task: 0.02
  headline_contrast: A5_generated_geo_minus_A3_copy_geo
  source_only_contrast: A4_generated_minus_A2_copy
  headroom_contrast: A7_restored_real_geo_minus_A3_copy_geo
  holdout_heterogeneity: report_each_plus_hierarchical_summary

exclusions:
  corrupt_or_missing_fields: reject_before_run_and_report_count
  failed_generator_samples: report_and_count_as_admissibility_failures
  posthoc_endpoint_switching: prohibited
  posthoc_stratum_merging: prohibited

freeze_record:
  frozen_at_utc: "2026-07-15T19:57:32Z"
  base_commit: b765b73
  binding: git_commit_containing_this_record
  approvers: [project_owner]
  final_track1_authorized_at_utc: "2026-07-16T06:29:36Z"
  rationale_document: case_studies/tropical_cyclone_bt/protocol_freeze.md
  amendments:
    - date: "2026-07-16"
      stage: after_first_final_output_audit_before_superseding_final_run
      change: >-
        Mark global rows as as-provided label-mixture composition checks whenever
        real and generated label proportions differ; retain every global result but
        do not present it as conditional-generator fidelity. Stratify the localized
        copying test jointly by intensity class and training-fitted feature region,
        with one Bonferroni family across all supported cells.
      reason: >-
        The frozen manifests show a natural real test mixture (3,942 TS through 85
        C5 frames) and a deliberately balanced generated bank (1,000 per class).
        The first completed output, SHA-256
        ff84f5e07de8658ea71faaf3486ee2134f837c352fd04f0d64db8c8d283cf572,
        made the implication visible: all seven functional pointwise detections
        were global while all 49 conditional/C4+ cells were non-detections. This
        is a target-distribution distinction, not permission to discard results.
        The same known label-mixture mismatch could confound generated-to-training
        versus real-to-training distances inside broad feature regions, so copying
        queries are now label-matched. The superseded run already detected no
        copying; this amendment was therefore not chosen to reverse an adverse
        copying conclusion. No functional, tolerance, stratum, reference draw,
        curve, feature metric, or physical conclusion is changed. The compressed
        superseded report is retained in the final artifact bundle.
    - date: "2026-07-16"
      stage: after_aborted_no_output_final_attempt_before_final_test_results
      change: >-
        Retain 2,000 reference draws for every functional-W1 cell and the complete
        simultaneous family; use 200 reference draws for secondary curve,
        feature-space, dependence, and admissibility diagnostics; cap quadratic
        feature-set metrics at deterministic matched samples of 256 per side per
        draw; cache training features; and record each complete deterministic
        partition plan by seed, SHA-256 digest, and a three-draw preview rather
        than serializing every index.
      reason: >-
        The first authorized runner invocation was stopped before producing any
        report or metric outcome after profiling exposed redundant quadratic work
        and a potentially enormous JSON partition manifest. These computational
        changes preserve the frozen primary statistics, tolerances, strata,
        generated bank, test set, model, and conclusion rules. Secondary metrics
        have no equivalence verdict and now report their effective draw and sample
        counts explicitly. The compact record is exactly reproducible from the
        frozen inputs, seed, and configuration and is integrity-checked by SHA-256.
    - date: "2026-07-16"
      stage: after_training_only_calibration_before_final_test
      change: >-
        Replace the all-DKW practical W1 interval for regular bounded scalar
        functionals with a two-sided 95% whole-block influence-function interval;
        retain DKW for the discrete maximum-gradient-radius functional. Determine
        UNDERPOWERED from direct confidence uncertainty rather than detection-shift
        sensitivity, which remains a separate diagnostic.
      reason: >-
        Training-only calibration proved that the all-DKW interval could not place
        even a perfect-generator control within any declared tolerance. The
        replacement uses all frames to estimate each storm CDF without treating
        frames as independent storms and passed pre-outcome boundary simulations
        for shifts, crossing CDFs, tail contamination, thin strata, and unequal
        cluster sizes. No tolerance, model, stratum, or test outcome was changed.
        Legacy tc-diffusion detection summaries were already known, but the
        replacement method and its gates were selected exclusively with
        training-only controls and synthetic boundary experiments before the
        GAUGE final run.
    - date: "2026-07-15"
      stage: before_final_test_and_before_generated_outcomes
      change: >-
        PSD boundaries use distinct observed radial Fourier shells nearest 24
        log-spaced targets, with geometric-midpoint boundaries.
      reason: >-
        Naive geometric edges created empty low-wavenumber bins on the declared
        256-by-256 grid, making the metric undefined. The support-aware rule
        preserves 24 ordered physical-wavenumber bins and is fixed before final use.
    - date: "2026-07-15"
      stage: after_training_only_control_calibration_before_final_test
      change: >-
        Severity-sweep response validity is based on a Spearman trend of at least
        0.8; crossing the real-reference boundary at maximum severity is retained
        as a separate resolution result. Binary positive controls still require
        detection.
      reason: >-
        The training-only calibration showed monotone or near-monotone responses
        below natural storm-to-storm variability for deliberately small blur and
        centering perturbations. Conflating response validity with detectability
        would discard responsive metrics instead of reporting their resolution.
    - date: "2026-07-15"
      stage: after_training_only_calibration_failure_before_final_test
      change: >-
        Apply the generator-training 170--325 K clipping lazily to real and
        generated analysis fields before every functional, curve, feature-space,
        dependence, and memorization calculation; retain raw archives unchanged.
      reason: >-
        The training-only calibration exposed that 170--325 K were preprocessing
        quantiles rather than raw physical extrema. The generator training code
        clips real fields to this interval, while GAUGE had evaluated raw fields,
        invalidating declared finite supports and creating a representation mismatch.
