schema: gauge_climate.analysis_protocol.v2

study:
  title: "REPLACE"
  authors: ["REPLACE"]
  versioned_at_utc: "REPLACE"
  commit: "REPLACE"
  primary_model: "REPLACE"
  supported_scope: "unpaired populations of independent 2-D gridded fields"

data:
  train_source: "REPLACE"
  heldout_real_source: "REPLACE"
  generated_source: "REPLACE"
  block_unit: "REPLACE: storm/event/year"
  split_rule: "REPLACE"
  split_frozen_before_training: true
  overlap_expected: 0
  temporal_sensitivity_split: null

evaluation:
  estimand: block_balanced  # block_balanced | frame_weighted
  estimand_justification: "REPLACE"
  n_eval: "REPLACE"
  n_eval_justification: "REPLACE: intended consumption size"
  reference_quantile: 0.95
  comparison_interval: 0.95
  summary_bootstrap_resamples: 1000
  n_reference_resamples: 200
  n_secondary_diagnostic_resamples: 200
  seed: 1789
  min_blocks_per_half: 10
  joint_verdict: prohibited

  functionals:
    - id: "REPLACE"
      definition: "REPLACE exact mathematical definition"
      units: "REPLACE"
      aspect: "amplitude | structure | extreme"
      tail_referenced: false
      finite_support: null  # optional [lower, upper] physical-validity check
      support_basis: null  # required only when finite_support is supplied
      lower_direction: "REPLACE"
      higher_direction: "REPLACE"

  feature_space:
    functional_ids: ["REPLACE"]
    embedding: "REPLACE: train-fit EOF/PCA or external frozen encoder"
    n_eof: 20
    fit_split: train
    fit_sample_rule: "REPLACE"
    scaling: "training mean and standard deviation"
    kernel_bandwidth_rule: "training-only median heuristic"
    set_metric_samples_per_draw: 256

  metrics:
    required: [functional_w1, feature_mmd2, density, coverage, diversity]
    feature_mmd2:
      estimator: nonnegative_biased_v_statistic
      kernel: gaussian
      bandwidth_fit_split: train
    density:
      reported_quantity: absolute_departure_from_density_equal_to_one
      real_manifold_neighbours: 5
    coverage:
      reported_quantity: one_minus_coverage
      real_manifold_neighbours: 5
    diversity:
      reported_quantity: absolute_relative_pairwise_distance_departure
      signed_direction_retained: true
    curve_metrics: []
    preprocessing_audits: []
    dependence_entries: "all off-diagonal Spearman entries"
    memorization_regions: 8
    memorization_query_strata: "REPLACE labels, or none with justification"

  sensitivity_lanes:
    - id: copyist
      source: training
      expected_metrics: [memorization]
      severities: [1.0]
    - id: "REPLACE"
      source: training
      perturbation: "REPLACE"
      expected_metrics: ["REPLACE"]
      severities: ["REPLACE ordered grid"]

  conditional:
    enabled: false
    strata: []
    global_condition_mixture: "skip | as_provided_composition_check | REPLACE common mixture"
    registered_pooled_strata: []
    thin_stratum_action: >-
      warn when resolution is limited; report NOT_EVALUATED below the declared
      minimum independent-block count

secondary_audits:
  continuous_condition_response: null
  feature_representation_robustness: null
  interpretation: "Descriptive only unless separately registered and validated."

analysis_exclusions:
  sample_exclusions: []
  metric_failure_policy: "Report failure; do not silently omit or replace."
  missing_data_policy: "REPLACE"
  outlier_policy: "No post-hoc removal unless listed above."

approval:
  scientific_reviewer: "REPLACE"
  statistical_reviewer: "REPLACE"
  approved_at_utc: "REPLACE"
