schema: gauge_climate.survey_protocol.v1
status: NOT_FROZEN
headline_use_permitted: false

research_question: >-
  Which evaluation practices are reported in peer-reviewed generative-model
  studies producing climate, weather, or geophysical fields?

databases:
  institutional:
    - name: TODO
      query: TODO
      search_date: TODO
      exported_record_checksum: TODO
  open_indexes:
    - name: TODO
      query: TODO
      search_date: TODO
      exported_record_checksum: TODO

eligibility:
  include:
    - generates a climate, weather, or geophysical field rather than only a scalar/tabular output
    - reports an empirical evaluation of generated outputs
    - peer-reviewed publication under the frozen corpus rule
  exclude:
    - purely deterministic prediction without a generative distribution
    - non-geophysical imagery without a declared Earth-system use
    - abstract-only records without evaluable full text
  borderline_rule: TODO_FREEZE_BEFORE_RECONCILIATION

screening:
  deduplication_key: [doi, normalized_title]
  title_abstract_reviewers: 2
  full_text_reviewers: 2
  disagreement_resolution: consensus_with_logged_reason
  flow_counts_source: generated_from_screening_log_only

coding:
  source_codebook: survey/exports/codebook.csv
  double_code_fraction: 0.20
  blinded_sample: survey/exports/double_coding_sample.csv
  agreement:
    report: [raw_agreement, cohen_kappa]
    rare_criterion_coefficient: gwet_ac1
  full_corpus_human_verification:
    - "Q4b: memorization/NN check?"
    - "Q5b: downstream-task utility (TSTR)?"
    - "V1: metric-validity control?"
    - "U2: real-vs-real reference computed?"

unresolved:
  - freeze every database query and search date
  - reconcile all current coded rows against the screened corpus
  - code all outstanding candidates
  - freeze and code downstream baseline strength
  - finish blinded recoding and full-corpus load-bearing verification
