name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m ruff check src/gauge_climate tests/test_gauge_*.py
          scripts/validate_gauge_statistics.py scripts/audit_release_gates.py
          scripts/fetch_tc_artifact.py survey
      - run: python -m pytest tests/test_gauge_*.py
      - run: python examples/minimal.py
      - run: gauge-climate validate tests/fixtures/tc_bt/config.yaml
      - run: gauge-climate run tests/fixtures/tc_bt/config.yaml
      - run: gauge-climate --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import gauge_climate; print(gauge_climate.__version__)"
      - run: python examples/minimal.py

  optional-xarray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,xarray]"
      - run: python -m pytest tests/test_gauge_xarray.py
