[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gauge-climate"
version = "0.1.0"
description = "Reference-aware evaluation of generated Earth-system fields."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{name = "Guido Ascenso"}]
keywords = ["climate", "weather", "generative-models", "evaluation", "wasserstein"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.scripts]
gauge-climate = "gauge_climate.cli:main"

[project.urls]
Documentation = "https://github.com/gascenso/climategen-eval#readme"
Repository = "https://github.com/gascenso/climategen-eval"
Issues = "https://github.com/gascenso/climategen-eval/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]
xarray = ["xarray>=2023.1", "dask[array]>=2023.1"]
survey = ["openpyxl>=3.1", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gauge_climate*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402", "E731"]
